# CI — CLAUDE.md rule #7: "Lint + tests run in CI on every PR. Red CI blocks merge."
#
# This file is only half the rule. The other half is a branch-protection
# setting in GitHub: Settings → Branches → protect `main` → require the "check"
# job to pass. Without that, CI is a notification, not a gate — and a
# notification is something people learn to scroll past.
#
# Note what this job does NOT do: reimplement the checks. It runs
# `./scripts/check.sh`, the same script you run locally. Two lists of checks
# drift, and the one that drifts is always the local one, so "it passed on my
# machine" quietly stops meaning anything.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same PR cancels the previous run. Reviewing the results of
# a superseded commit wastes both CI minutes and attention.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · migrations · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # The tests run against a REAL Postgres, not SQLite and not a mock. The
      # bugs they exist to catch — a missing agency_id in a WHERE clause, a
      # constraint that rejects a legal value, a `JSONField` lookup that only
      # works on one backend — are invisible to both.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rihlati
          POSTGRES_PASSWORD: rihlati_ci
          POSTGRES_DB: rihlati
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rihlati -d rihlati"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://rihlati:rihlati_ci@localhost:5432/rihlati
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # A CI-only value. It is not a secret: this key signs sessions for a
      # database that is created and destroyed inside the job and holds nothing
      # but fixtures. Real secrets NEVER appear in this file — they go in
      # repository secrets (rule #1).
      DJANGO_SECRET_KEY: ci-only-key-not-used-anywhere-a-human-can-reach

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The script looks for .venv/bin first and falls back to whatever is on
      # PATH, which is exactly the situation here.
      - name: Lint, migrations, tests
        run: ./scripts/check.sh

  # A separate job so it is legible in the PR checks list as its own line.
  # Rule #1: a key that has ever touched a commit is burned.
  secrets:
    name: no secrets in the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added three commits ago and "removed" in the
          # latest one is still in the repository forever.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every key it held."
            exit 1
          fi

          if git ls-files | grep -qE '\.sqlite3$'; then
            echo "::error::A SQLite database is tracked. It may hold real data — remove it."
            exit 1
          fi

          # Deliberately narrow. A pattern that fires on the word "password"
          # anywhere matches every comment and doc in the repo, and a check
          # that cries wolf gets disabled within a week.
          pattern='(sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|(secret|password|api[_-]?key)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{12,}["'"'"'])'

          if git grep -InE "$pattern" -- \
              ':!*.md' ':!obsidian/**' ':!.github/workflows/*' ':!.env.example' \
              ':!package-lock.json' ':!**/test*.py' ':!**/commands/seed_preview.py'; then
            echo "::error::Possible secret above. If it is real, ROTATE it — deleting the line is not enough."
            exit 1
          fi

          echo "No secrets found in tracked files."
