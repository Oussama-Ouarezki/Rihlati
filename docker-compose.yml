# Local development database only. Production uses managed Postgres with
# point-in-time recovery (rule #5).
#
#   docker compose up -d        start
#   docker compose logs -f db   watch
#   docker compose down         stop (keeps data)
#   docker compose down -v      stop AND DELETE ALL LOCAL DATA

services:
  db:
    image: postgres:17-alpine
    container_name: rihlati_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rihlati
      POSTGRES_PASSWORD: rihlati_local_dev
      POSTGRES_DB: rihlati
    ports:
      # 5433 on purpose, so it never fights a Postgres already on your machine.
      - "5433:5432"
    volumes:
      - rihlati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rihlati -d rihlati"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rihlati_pgdata:
